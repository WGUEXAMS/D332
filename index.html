<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to Cryptography Quiz</title>
<style>
  :root{--bg:#f5f5f3;--card:#fff;--border:#d3d1c7;--border2:#b4b2a9;--text:#1a1a18;--text2:#888780;--hover:#f1efe8;--prog-bg:#e8e6df;--correct-bg:#EAF3DE;--correct-border:#639922;--correct-text:#27500A;--wrong-bg:#FCEBEB;--wrong-border:#A32D2D;--wrong-text:#501313;--reveal-bg:#E6F1FB;--reveal-border:#378ADD;--reveal-text:#0C447C;--selected-bg:#EEEAF8;--selected-border:#534AB7;--selected-text:#1a1a18;--accent:#534AB7;--flag:#D97706;--flag-bg:#FEF3C7;--flag-border:#F59E0B;--flag-text:#92400E;--badge-test-bg:#EAF3DE;--badge-test-text:#27500A;--badge-prac-bg:#E6F1FB;--badge-prac-text:#0C447C;}
  [data-theme="dark"]{--bg:#000;--card:#111;--border:#333;--border2:#444;--text:#fff;--text2:#aaa;--hover:#1a1a1a;--prog-bg:#222;--correct-bg:#0a2010;--correct-border:#3a7010;--correct-text:#7fcc40;--wrong-bg:#200a0a;--wrong-border:#8a1a1a;--wrong-text:#ff7070;--reveal-bg:#0a1a30;--reveal-border:#1a50a0;--reveal-text:#60a8ff;--selected-bg:#1a1030;--selected-border:#6060cc;--selected-text:#fff;--accent:#7b72d8;--flag:#B45309;--flag-bg:#1a1000;--flag-border:#D97706;--flag-text:#FCD34D;--badge-test-bg:#0a2010;--badge-test-text:#7fcc40;--badge-prac-bg:#0a1a30;--badge-prac-text:#60a8ff;}
  [data-theme="dark"] .header h1{color:#ffffff;}
  [data-theme="dark"] .q-text{color:#ffffff;}
  [data-theme="dark"] .q-counter{color:#aaaaaa;}
  [data-theme="dark"] body{color:#ffffff;}
  [data-theme="dark"] .card{color:#ffffff;}
  [data-theme="dark"] .mode-card .title{color:#ffffff;}
  [data-theme="dark"] .mode-card .desc{color:#d0d0d0;}
  [data-theme="dark"] .mode-card{background:#111;border-color:#444;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0;margin:0;transition:background .2s,color .2s;}
  .card{background:var(--card);padding:2rem;max-width:100%;width:100%;min-height:100vh;transition:background .2s;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
  .header h1{font-size:18px;font-weight:500;}
  .dark-toggle{background:transparent;border:.5px solid var(--border2);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;transition:background .15s;}
  .dark-toggle:hover{background:var(--hover);color:var(--text);}
  .mode-screen{text-align:center;padding:1rem 0 1.5rem;}
  .mode-screen>p{font-size:14px;color:var(--text2);margin-bottom:2rem;}
  .mode-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .mode-card{border:.5px solid var(--border);border-radius:12px;padding:1.5rem 1.25rem;width:200px;cursor:pointer;text-align:left;background:var(--card);transition:background .15s,border-color .15s;}
  .mode-card:hover{background:var(--hover);border-color:var(--border2);}
  .mode-card .icon{font-size:22px;margin-bottom:.65rem;}
  .mode-card .title{font-size:15px;font-weight:500;margin-bottom:.35rem;}
  .mode-card .desc{font-size:13px;color:var(--text2);line-height:1.5;}
  .mode-badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 10px;border-radius:99px;margin-bottom:.7rem;}
  .badge-test{background:var(--badge-test-bg);color:var(--badge-test-text);}
  .badge-practice{background:var(--badge-prac-bg);color:var(--badge-prac-text);}
  .progress-bar-bg{background:var(--prog-bg);border-radius:99px;height:6px;margin-bottom:1.25rem;overflow:hidden;}
  .progress-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease;}
  .q-counter{font-size:13px;color:var(--text2);margin-bottom:.35rem;}
  .q-text{font-size:16px;font-weight:500;margin-bottom:1rem;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:9px;}
  .opt-btn{background:var(--card);border:.5px solid var(--border2);border-radius:8px;padding:11px 15px;text-align:left;font-size:14px;color:var(--text);cursor:pointer;transition:background .15s,border-color .15s;line-height:1.45;font-family:inherit;}
  .opt-btn:hover{background:var(--hover);}
  .opt-btn.selected{background:var(--selected-bg);border-color:var(--selected-border);color:var(--selected-text);font-weight:500;}
  .opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct-text);}
  .opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-text);}
  .opt-btn.revealed{background:var(--reveal-bg);border-color:var(--reveal-border);color:var(--reveal-text);}
  .opt-btn.picked{background:var(--selected-bg);border-color:var(--selected-border);color:var(--selected-text);font-weight:500;}
  .opt-btn:disabled{cursor:default;}
  .hint{font-size:12px;color:var(--text2);margin-top:.4rem;}
  .feedback-wrap{margin-top:1rem;min-height:20px;}
  .feedback{font-size:14px;font-weight:500;}
  .feedback.correct{color:var(--correct-border);}
  .feedback.wrong{color:var(--wrong-border);}
  .feedback.info{color:var(--reveal-border);}
  .rationale{font-size:13px;color:var(--text2);margin-top:.75rem;line-height:1.55;padding:10px 12px;background:var(--hover);border-radius:7px;border-left:3px solid var(--accent);}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;gap:8px;flex-wrap:wrap;}
  .nav-left,.nav-right{display:flex;gap:7px;flex-wrap:wrap;}
  .action-btn{background:transparent;border:.5px solid var(--border2);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;transition:background .15s;}
  .action-btn:hover:not(:disabled){background:var(--hover);color:var(--text);}
  .action-btn:disabled{opacity:.3;cursor:default;}
  .action-btn.active-toggle{background:var(--reveal-bg);border-color:var(--reveal-border);color:var(--reveal-text);}
  .flag-btn{background:transparent;border:.5px solid var(--border2);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;transition:background .15s,border-color .15s;}
  .flag-btn:hover{background:var(--flag-bg);border-color:var(--flag-border);color:var(--flag-text);}
  .flag-btn.flagged{background:var(--flag-bg);border-color:var(--flag-border);color:var(--flag-text);font-weight:500;}
  .next-btn{background:transparent;border:.5px solid var(--border2);border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;color:var(--text);font-family:inherit;transition:background .15s;}
  .next-btn:hover{background:var(--hover);}
  .submit-btn{background:var(--accent);border:.5px solid var(--accent);border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;color:#fff;font-family:inherit;}
  .submit-btn:hover{opacity:.9;}
  .num-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:1.1rem;padding-top:1rem;border-top:.5px solid var(--border);}
  .num-btn{width:30px;height:28px;border-radius:6px;border:.5px solid var(--border2);background:var(--card);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;position:relative;transition:background .12s;}
  .num-btn:hover{background:var(--hover);color:var(--text);}
  .num-btn.active{border-color:var(--accent);color:var(--accent);font-weight:700;}
  .num-btn.num-selected{background:var(--selected-bg);border-color:var(--selected-border);color:var(--selected-text);}
  .num-btn.done-correct{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct-text);}
  .num-btn.done-wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-text);}
  .num-btn.done-revealed{background:var(--reveal-bg);border-color:var(--reveal-border);color:var(--reveal-text);}
  .num-btn.done-picked{background:var(--selected-bg);border-color:var(--selected-border);color:var(--selected-text);}
  .num-btn.flagged{background:var(--flag-bg);border-color:var(--flag-border);color:var(--flag-text);}
  .num-btn.flagged::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:99px;background:var(--flag);}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:.5rem;font-size:11px;color:var(--text2);}
  .legend-item{display:flex;align-items:center;gap:4px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;border:.5px solid;}
  .score-card{text-align:center;padding:1.5rem .5rem;}
  .score-num{font-size:52px;font-weight:500;color:var(--accent);}
  .score-label{font-size:15px;color:var(--text2);margin-bottom:1.25rem;}
  .score-msg{font-size:15px;margin-bottom:1.25rem;}
  .summary-row{display:flex;gap:12px;justify-content:center;margin-bottom:1.25rem;flex-wrap:wrap;}
  .summary-pill{font-size:13px;padding:6px 14px;border-radius:99px;font-weight:500;}
  .pill-correct{background:var(--correct-bg);color:var(--correct-text);}
  .pill-wrong{background:var(--wrong-bg);color:var(--wrong-text);}
  .pill-flag{background:var(--flag-bg);color:var(--flag-text);border:.5px solid var(--flag-border);}
  .end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:1.25rem;}
  .restart-btn{background:transparent;border:.5px solid var(--border2);border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit;transition:background .15s;}
  .restart-btn:hover{background:var(--hover);}
  .missed-list{text-align:left;margin-top:1rem;}
  .missed-item{background:var(--hover);border-radius:8px;padding:11px 13px;margin-bottom:9px;font-size:13px;border-left:3px solid var(--wrong-border);}
  .missed-q{font-weight:500;margin-bottom:4px;}
  .missed-a{color:var(--correct-border);}
  .practice-end{text-align:center;padding:1.5rem 0;}
  .practice-end .big{font-size:36px;margin-bottom:.5rem;}
  .practice-end h2{font-size:18px;font-weight:500;margin-bottom:.5rem;}
  .practice-end p{font-size:14px;color:var(--text2);margin-bottom:1.5rem;}
  .history-screen{padding:.5rem 0 1.5rem;}
  .history-screen h2{font-size:16px;font-weight:500;margin-bottom:1rem;}
  .history-empty{font-size:14px;color:var(--text2);padding:2rem 0;text-align:center;}
  .history-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem;}
  .history-table th{text-align:left;padding:8px 10px;border-bottom:.5px solid var(--border2);color:var(--text2);font-weight:500;}
  .history-table td{padding:9px 10px;border-bottom:.5px solid var(--border);color:var(--text);}
  .history-table tr:last-child td{border-bottom:none;}
  .hist-pass{color:var(--correct-border);font-weight:600;}
  .hist-fail{color:var(--wrong-border);font-weight:600;}
  .hist-mid{color:var(--flag);font-weight:600;}
  .clear-hist-btn{background:transparent;border:.5px solid var(--wrong-border);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;color:var(--wrong-text);font-family:inherit;}
  .clear-hist-btn:hover{background:var(--wrong-bg);}
  .coffee-btn{position:fixed;bottom:24px;right:24px;background:#FFDD00;border:none;border-radius:99px;padding:14px 24px;font-size:16px;font-weight:700;color:#000;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:9999;transition:transform .15s,box-shadow .15s;}
  .coffee-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.22);}
  .coffee-btn span{font-size:22px;}
</style>
</head>
<body>
<div class="card" id="app" data-theme="light">
  <div class="header">
    <h1>Introduction to Cryptography Quiz</h1>
    <button class="dark-toggle" id="theme-btn" onclick="toggleDark()">&#127769; Dark</button>
  </div>
  <div id="root"></div>
</div>
<script>
function toggleDark(){const a=document.getElementById('app');const d=a.getAttribute('data-theme')==='dark';a.setAttribute('data-theme',d?'light':'dark');document.getElementById('theme-btn').textContent=d?'\u{1F319} Dark':'\u2600\uFE0F Light';}

const questions=[
  {q:"What is an alternative to using a Certificate Revocation List (CRL) with certificates?",opts:["Privacy Enhanced Mail (PEM)","Online Certificate Status Protocol (OCSP)","Root Certificate Authority (CA)","Policy Certificate Authority (CA)"],ans:1,rat:"OCSP is the primary online alternative to CRLs for checking whether a certificate has been revoked. OCSP allows a client to query an OCSP responder in near real time about the status of a specific certificate (good, revoked, or unknown), providing more timely and certificate-specific revocation status than CRLs."},
  {q:"A company wants to use certificates issued by a root CA to demonstrate to customers that it is a legitimate company. Who needs to trust the root CA public key?",opts:["The seller and the buyer","The cloud provider and the seller","The Federal Trade Commission and the cloud provider","The buyer and the Federal Trade Commission"],ans:0,rat:"For customers to accept the company's certificate as legitimate, the buyer must trust the root CA public key to validate the certificate chain. The seller also must trust the root CA to build and present a valid chain. The cloud provider's trust is not what makes the certificate valid to customers."},
  {q:"Which operation can be performed on a certificate during the 'Issued' stage?",opts:["Creation","Key recovery","Distribution","Key archiving"],ans:2,rat:"The 'Issued' stage means the certificate has been generated and signed by the CA and is now valid for use. At this point, the operational focus shifts to making it available — Distribution is the lifecycle activity most directly associated with an issued certificate."},
  {q:"Which authentication method allows a web service installed on a network operating system to prove its identity to a customer?",opts:["One-way client authentication","One-way server authentication","Mutual authentication","End-to-end authentication"],ans:1,rat:"One-way server authentication is the standard model used by TLS-enabled web services to prove the server's identity to a client. The server presents an X.509 certificate during the TLS handshake, and the client validates the certificate chain without being required to present its own certificate."},
  {q:"Which authentication method allows a customer to authenticate to a web service?",opts:["One-way server authentication","End-to-end authentication","Mutual authentication","One-way client authentication"],ans:3,rat:"One-way client authentication is the method where the client (customer) proves its identity to the server. The server requests a client certificate and the client demonstrates possession of the corresponding private key. The server validates the client certificate chain and authorization policy."},
  {q:"What type of encryption uses different keys to encrypt and decrypt the message?",opts:["Symmetric","Private key","Secure","Asymmetric"],ans:3,rat:"Asymmetric encryption (public key cryptography) uses a pair of mathematically related keys: a public key and a private key. One key is used to encrypt and the other to decrypt. Symmetric encryption uses the same shared key for both operations."},
  {q:"Which certificate encoding process is binary-based?",opts:["Public Key Infrastructure (PKI)","Distinguished Encoding Rules (DER)","Rivest–Shamir–Adleman (RSA)","Privacy Enhanced Mail (PEM)"],ans:1,rat:"DER (Distinguished Encoding Rules) is a binary encoding format used to represent ASN.1 structures in a canonical, unambiguous way. PEM is a Base64-encoded text wrapper around DER data. PKI is a framework, not an encoding. RSA is an asymmetric algorithm, not a certificate encoding format."},
  {q:"What are the roles of keys when using digital signatures?",opts:["A private key is used for both signing and signature validation.","A private key is used for signing, and a public key is used for signature validation.","A public key is used for both signing and signature validation.","A public key is used for signing, and a private key is used for signature validation."],ans:1,rat:"The signer uses the private key to create a signature over a message hash. Anyone with the corresponding public key can then validate the signature. If a public key were used to sign, anyone could forge signatures. The public key is widely distributed while the private key must be protected."},
  {q:"A security engineer is implementing device authentication as a form of two-factor authentication in a PKI environment. What should be used as a second form of authentication?",opts:["Symmetric encryption","Digital certificate","Asymmetric encryption","Digital signature"],ans:1,rat:"In a PKI environment, a digital certificate is the standard credential used to bind an identity to a public key. For device authentication, the device proves possession of the private key corresponding to the certificate's public key, representing 'something you have' as the second factor."},
  {q:"An organization wants to digitally sign its software to guarantee the integrity of its source code. Which key should the customer use to decrypt the digest of the source code?",opts:["Customer's private key","Organization's public key","Organization's private key","Customer's public key"],ans:1,rat:"When software is digitally signed, the organization signs the digest using its private key. Verification works in the opposite direction: the customer uses the organization's public key to validate the signature. Sharing the organization's private key would destroy security and enable forgery."},
  {q:"Two people want to communicate through secure email. The person creating the email wants to ensure only their friend can decrypt the email. Which key should the person use to encrypt the message?",opts:["Sender's public key","Recipient's private key","Sender's private key","Recipient's public key"],ans:3,rat:"To ensure only the recipient can decrypt an email, the sender must encrypt using the recipient's public key. Only the recipient possesses the matching private key, so only they can decrypt the ciphertext. This is the fundamental principle used in S/MIME and OpenPGP."},
  {q:"What is the length of the Initialization Vector (IV) in WEP?",opts:["24 bits","40 bits","48 bits","56 bits"],ans:0,rat:"WEP uses RC4 and combines a 24-bit per-packet IV with a shared secret key. The short 24-bit IV space (2^24 possible values) is a major weakness: on a busy network, IVs repeat frequently, causing keystream reuse and enabling statistical attacks like the FMS attack."},
  {q:"What is the RC4 encryption key size when utilizing WPA with Temporal Key Integrity Protocol (TKIP)?",opts:["40 bits","56 bits","128 bits","256 bits"],ans:2,rat:"WPA with TKIP uses RC4 with a 128-bit encryption key. TKIP improves on WEP by introducing per-packet key mixing, the 'Michael' message integrity mechanism, and replay protection. Even with improvements, TKIP is deprecated in favor of WPA2/WPA3 using AES-based CCMP/GCMP."},
  {q:"Which wireless security standard uses an authentication server with 802.1X and EAP?",opts:["WPA-PSK","WEP","WPA-Enterprise","TKIP"],ans:2,rat:"WPA-Enterprise explicitly uses 802.1X + EAP with an authentication server (commonly RADIUS) to perform per-user/per-device authentication and derive dynamic session keys. WPA-PSK uses a pre-shared key without an external server. TKIP is an encryption protocol, not a full authentication standard."},
  {q:"Which mechanism implemented in WPA-Enterprise guards against bit-flipping exploits?",opts:["Advanced Encryption Standard (AES)","Pre-shared key (PSK)","Message Integrity Check (MIC)","Global encryption key"],ans:2,rat:"TKIP introduced a Message Integrity Check (MIC) called 'Michael' to guard against bit-flipping attacks. If an attacker flips bits in transit, the MIC verification fails and the frame is rejected. A pre-shared key is an authentication method, and a global encryption key would worsen security."},
  {q:"Which default port must be allowed by firewalls for the key exchange of the IPsec handshaking process to be successful?",opts:["TCP 443","UDP 443","TCP 500","UDP 500"],ans:3,rat:"IPsec's IKE (Internet Key Exchange) uses UDP port 500 by default for both IKEv1 and IKEv2. If a firewall blocks UDP 500, the IKE negotiation cannot begin, preventing IPsec tunnels from forming. Port 443 is associated with HTTPS/TLS, not IPsec IKE."},
  {q:"Which type of network were VPN connections originally designed to tunnel through?",opts:["Encrypted","Protected","Public","Private"],ans:2,rat:"VPNs were built to allow secure, private communication over an otherwise untrusted or shared public network. 'Encrypted' and 'protected' describe properties of the VPN tunnel itself. 'Private' describes a dedicated internal network, which generally does not require a VPN for confidentiality."},
  {q:"An administrator has configured an IPsec transport mode with ESP between two offices. In which situation can the packet content be inspected?",opts:["On devices at headquarters and offsite before being sent and after being received","In the headquarters and offsite networks after data has been sent","Only in the offsite location's network while data is in transit","Only in the headquarters network while data is in transit"],ans:0,rat:"With IPsec ESP in transport mode, the payload is encrypted between the two endpoints. Intermediate devices cannot view the encrypted content. The packet contents are inspectable only at the endpoints: before encryption on the sender and after decryption on the receiver."},
  {q:"A security analyst uses a polyalphabetic substitution cipher with a keyword of YELLOW to encrypt a message. Which cipher should be used?",opts:["Pigpen","Caesar","Vigenère","Playfair"],ans:2,rat:"The Vigenère cipher uses a keyword to select shifting alphabets across a message. Each key character defines a Caesar shift applied to the plaintext character. Pigpen is a symbol substitution cipher. Caesar is monoalphabetic with a single shift. Playfair is a digraph substitution cipher."},
  {q:"Which cipher uses shifting letters of the alphabet for encryption?",opts:["SHA-1","Vigenère","Bifid","Caesar"],ans:3,rat:"The Caesar cipher encrypts by shifting letters of the alphabet by a single fixed shift value applied uniformly across the entire message. Vigenère also involves shifting but uses a repeating keyword to vary the shift per character. SHA-1 is a hash function, and Bifid is a fractionation cipher."},
  {q:"Which technique involves spotting variations in encrypted data and plotting how the characters relate to standard English characters?",opts:["Brute force","Frequency analysis","Known plaintext","Chosen ciphertext"],ans:1,rat:"Frequency analysis exploits statistical patterns in natural language. The analyst counts ciphertext character occurrences and compares the distribution to expected English letter frequencies to infer likely plaintext mappings. It is effective against monoalphabetic substitution ciphers."},
  {q:"Which type of exploit involves looking for different inputs that generate the same hash?",opts:["Birthday attack","Linear cryptanalysis","Algebraic attack","Differential cryptanalysis"],ans:0,rat:"A birthday attack targets hash functions by exploiting the birthday paradox: collisions (two different inputs producing the same hash) can be found much faster than brute force. For an n-bit hash, the expected work to find a collision is ~2^(n/2). Linear and differential cryptanalysis target block ciphers."},
  {q:"What is the value of 23 mod 6?",opts:["03","04","05","06"],ans:2,rat:"23 mod 6 asks for the remainder when 23 is divided by 6. The largest multiple of 6 not exceeding 23 is 18. Subtracting: 23 - 18 = 5. Therefore, 23 mod 6 = 5. Modular arithmetic is foundational in public-key systems like RSA and Diffie-Hellman."},
  {q:"What is the value of 51 mod 11?",opts:["04","05","07","11"],ans:2,rat:"51 mod 11 is the remainder after dividing 51 by 11. The largest multiple of 11 not exceeding 51 is 44. Subtracting: 51 - 44 = 7. Therefore, 51 mod 11 = 7. Such residue computations underpin the wraparound behavior used in RSA and Diffie-Hellman group operations."},
  {q:"What is an attribute of RC4 when used with WEP?",opts:["40-bit key","128-bit key","256-bit key","512-bit key"],ans:0,rat:"In classic WEP deployments, RC4 was used with a 40-bit shared secret key (also labeled '64-bit WEP' because it combines the 40-bit key with a 24-bit IV to form a 64-bit RC4 seed). This was originally chosen due to export restrictions. WEP's failure stems from IV reuse and key scheduling vulnerabilities."},
  {q:"Which symmetric encryption technique uses a 256-bit key size and a 128-bit block size?",opts:["3DES","DES","IDEA","AES"],ans:3,rat:"AES supports key sizes of 128, 192, and 256 bits with a fixed 128-bit block size. DES and 3DES use 64-bit blocks. IDEA also uses a 64-bit block size with a 128-bit key. Only AES supports a 256-bit key while maintaining a 128-bit block size."},
  {q:"Which symmetric encryption technique uses a 112-bit key size and a 64-bit block size?",opts:["AES","3DES","DES","IDEA"],ans:1,rat:"3DES (two-key variant) uses two independent 56-bit DES keys in an Encrypt-Decrypt-Encrypt (EDE) sequence, yielding 112 bits of keying material, while retaining DES's 64-bit block size. DES uses only 56-bit keys. AES has a 128-bit block size. IDEA has a 64-bit block but uses a 128-bit key."},
  {q:"What makes the RC4 cipher unique compared to RC5 and RC6?",opts:["Stream","Asymmetric","Symmetric","Block"],ans:0,rat:"RC4 is unique because it is a stream cipher — it generates a pseudorandom keystream and encrypts data by XORing that keystream with plaintext bytes. RC5 and RC6 are block ciphers that encrypt fixed-size blocks through multiple rounds of operations. RC4 has been deprecated due to statistical biases in its keystream."},
  {q:"Which number of bits gets encrypted each time encryption is applied during stream encryption?",opts:["1","40","192","256"],ans:0,rat:"In the classical definition, a stream cipher encrypts data one bit at a time by combining plaintext with a keystream via XOR. While many practical stream ciphers operate on bytes for efficiency, the conceptual distinction from block ciphers is processing data as a continuous stream rather than fixed-size blocks."},
  {q:"What is used to randomize the initial value when generating Initialization Vectors (IVs)?",opts:["Key","Plaintext","Algorithm","Nonce"],ans:3,rat:"A nonce (number used once) is used to ensure uniqueness of IVs per encryption operation. Modes like CTR use a nonce combined with a counter to produce unique input blocks. The encryption key should remain stable across many operations and should not be used as the randomizer for IV generation."},
  {q:"Which additional input element can be used to implement integrity in combination with symmetric ciphers?",opts:["Initialization vector","Encoding algorithm","Nonce value","Hash function"],ans:3,rat:"Symmetric encryption alone provides confidentiality but not integrity. A hash function enables integrity checks through HMAC (Hash-based Message Authentication Code) constructions like HMAC-SHA-256. An IV and nonce ensure uniqueness but do not guarantee integrity. An encoding algorithm changes representation, not security."},
  {q:"Employee A needs to send Employee B a symmetric key for confidential communication. Which key is used to encrypt the symmetric key?",opts:["Employee A's private key","Employee B's public key","Employee A's public key","Employee B's private key"],ans:1,rat:"To ensure only Employee B can recover the symmetric key, Employee A encrypts it using Employee B's public key. Only Employee B possesses the matching private key to decrypt it. This is the hybrid cryptography pattern used in TLS and secure email. Employee B's private key should never be shared."},
  {q:"A Linux user password is identified as: $2a$08$AbCh0RCM... Which hash algorithm should be used to salt this password?",opts:["NTLM","SHA-512","MD5","bcrypt"],ans:3,rat:"The prefix '$2a$' indicates bcrypt (version 2a), and '08' is the cost factor. Bcrypt is designed specifically for password storage with a built-in salt and intentional slowness that makes brute-force attacks expensive. NTLM and MD5 are obsolete for secure password storage. SHA-512 is too fast without a dedicated password-hashing construction."},
  {q:"Which component is used to verify the integrity of a message?",opts:["TKIP","HMAC","AES","IV"],ans:1,rat:"HMAC (Hash-based Message Authentication Code) verifies both integrity and authenticity of a message using a shared secret key and a hash function like SHA-256. The sender computes an HMAC tag over the message; the receiver recomputes it to detect tampering. AES provides confidentiality, not standalone integrity."},
  {q:"How does adding salt to a password improve security?",opts:["Salt creates a different hash if two people use the same password.","Salt enforces the complexity rules for passwords.","Salt ensures two people do not have the same password.","Salt prevents users from reusing the same password."],ans:0,rat:"A salt is a unique random value combined with the password during hashing. It ensures identical passwords produce different hashes across accounts, defeating rainbow table precomputation attacks and preventing attackers from spotting shared passwords by comparing hashes. Salt does not enforce complexity rules or password uniqueness."},
  {q:"Why should a forensic investigator create a hash of a victim's hard drive and of the bitstream copy of the hard drive?",opts:["To identify if someone opened the drive","To certify the information on the drive is correct","To establish who created the files on the drives","To verify that the drives are identical"],ans:3,rat:"Creating cryptographic hashes of both the original drive and the forensic bitstream image provides mathematical assurance that the copy is an exact, bit-for-bit replica. Matching hashes confirm the evidence examined is identical to what was collected, supporting admissibility and credibility in legal contexts."},
  {q:"What is the length (in bits) of a SHA-1 hash output?",opts:["40","80","160","320"],ans:2,rat:"SHA-1 produces a fixed-size output of 160 bits (20 bytes). For an n-bit hash, finding a collision by generic means takes ~2^(n/2) operations. SHA-1's 160-bit output gave a bound of ~2^80, but cryptanalytic advances have broken it in practice, and SHA-1 is now deprecated for most security uses."},
  {q:"What describes how Counter (CTR) mode encryption functions?",opts:["Converts the block cipher into a stream cipher, then uses a counter value and a nonce to encrypt the data","Uses a self-synchronizing stream cipher where the IV is encrypted and XORed with the data stream one bit at a time","Encrypts each block with the same key, where each block is independent of the others","Uses an IV to encrypt the first block, then uses the result of the encryption to encrypt the next block"],ans:0,rat:"CTR mode turns a block cipher into a stream-like construction by encrypting successive nonce||counter blocks to generate a keystream, then XORing with plaintext. This enables parallelization and random access decryption. Option B describes CFB-like behavior. Option C describes ECB. Option D describes CBC."},
  {q:"How does Electronic Codebook (ECB) mode encryption function?",opts:["Converts from block to stream, then uses a counter value and a nonce","Uses a self-synchronizing stream on the blocks, XORed with the data stream","Uses an IV to encrypt the first block, then uses the result to encrypt the next block","Encrypts each block with the same key, where each block is independent of the others"],ans:3,rat:"ECB is the simplest block cipher mode: each plaintext block is encrypted independently using the same key. There is no IV and no chaining, so identical plaintext blocks produce identical ciphertext blocks. This pattern leakage makes ECB generally insecure for most real-world data."},
  {q:"Which mode of encryption uses an Initialization Vector (IV) to encrypt the first block and then uses the result to encrypt the next block?",opts:["Electronic Codebook (ECB)","Cipher Block Chaining (CBC)","Output Feedback (OFB)","Cipher Feedback (CFB)"],ans:1,rat:"CBC mode XORs each plaintext block with the previous ciphertext block before encryption, creating chaining dependency. An IV is used for the first block. This prevents the pattern leakage seen in ECB. CBC still requires integrity protection (e.g., HMAC or AEAD) as it is malleable without authentication."},
  {q:"Which mode of encryption converts data into a stream encryption and then uses a counter value and a nonce to encrypt the data?",opts:["Electronic Codebook (ECB)","Counter (CTR)","Cipher Block Chaining (CBC)","Cipher Feedback (CFB)"],ans:1,rat:"CTR mode generates a keystream from encrypted counter blocks (nonce + incrementing counter) and XORs with plaintext. It is highly parallelizable and supports random access. ECB and CBC are traditional block modes. CFB is a feedback mode that can behave stream-like but does not use the explicit counter/nonce construction."},
  {q:"Which encryption algorithm uses an 80-bit key and operates on 64-bit data blocks?",opts:["Twofish","Blowfish","Camellia","Skipjack"],ans:3,rat:"Skipjack operates on 64-bit blocks and uses an 80-bit key, historically associated with the Clipper chip initiative. Twofish is a 128-bit block cipher with keys up to 256 bits. Blowfish is 64-bit block with variable keys up to 448 bits. Camellia is a 128-bit block cipher with 128, 192, or 256-bit keys."},
  {q:"What is the maximum key size (in bits) supported by AES?",opts:["128","192","256","512"],ans:2,rat:"AES supports three standardized key sizes: 128, 192, and 256 bits, with a fixed 128-bit block size. The maximum is 256 bits (AES-256). AES-512 is not part of the AES standard. AES-256 is often chosen for compliance requirements or conservative security margins against future advances."},
  {q:"What is the correlation between the number of rounds and the key length used in the AES algorithm?",opts:["The number of rounds decreases as the key length increases.","The number of rounds increases as the key length increases.","The key length is the same regardless of the number of rounds.","The number of rounds is the same regardless of the key length."],ans:1,rat:"In AES, number of rounds is tied to key length: AES-128 uses 10 rounds, AES-192 uses 12 rounds, and AES-256 uses 14 rounds. Additional rounds increase diffusion and confusion, strengthening resistance against cryptanalysis. This relationship is fixed by the AES specification."},
  {q:"Which encryption algorithm encrypts with one key, decrypts with another key, and then encrypts with the first key?",opts:["IDEA","AES","3DES","DES"],ans:2,rat:"3DES uses an Encrypt-Decrypt-Encrypt (EDE) sequence. In the two-key form: encrypt with K1, decrypt with K2, encrypt again with K1. This EDE construction was chosen partly for backward compatibility — if K1=K2=K3, the scheme reduces to single DES. AES and IDEA do not use this triple-stage structure."},
  {q:"Which attack maps hashed values to their original input data?",opts:["Dictionary","Rainbow table","Birthday","Brute-force"],ans:1,rat:"A rainbow table attack uses large precomputed tables that link hash outputs back to likely original inputs using chains of hash operations and reduction functions. Salt defeats rainbow tables because attackers would need separate tables for each salt value. Dictionary attacks compute hashes on the fly. Birthday attacks target collisions."},
  {q:"Which attack may take the longest amount of time to achieve success?",opts:["Birthday","Rainbow table","Dictionary","Brute-force"],ans:3,rat:"A brute-force attack exhaustively tries every possible key or password candidate, making it the slowest method — especially against strong keys, long passwords, rate limits, and slow hashing (bcrypt/Argon2). Dictionary attacks try only common passwords. Rainbow tables leverage precomputation. Birthday attacks find collisions with less work."},
  {q:"Why should an asymmetric private key be used to encrypt the digest of an application?",opts:["It uses the same key to encrypt and decrypt large amounts of media, one bit at a time.","It signs files by signing (encrypting) the hash of a file so integrity and authenticity can be verified with the corresponding public key.","It encrypts and decrypts data in blocks of characters at a time with a complex algorithm.","It encrypts a small amount of information, which is decrypted with the corresponding private key."],ans:1,rat:"Digital signing works by hashing the application and using the publisher's private key to sign that digest. Only the publisher can produce a valid signature, and verifiers use the public key to confirm integrity (software hasn't changed) and authenticity (it came from the private-key holder). Verification uses the public key, not a second private key."},
  {q:"Why should an administrator choose lightweight cryptography?",opts:["The desktop is in a secure area of the building.","The embedded system has limited resources.","The payload requires complex rounds of encryption.","The data requires minimal protection due to the sensitivity level."],ans:1,rat:"Lightweight cryptography is designed for constrained environments with limited CPU, memory, storage, bandwidth, and power — such as IoT sensors, RFID tags, and embedded controllers. The goal is efficient security fitting strict resource budgets, not weaker security. Physical location of a desktop is irrelevant to this choice."},
  {q:"Which cryptographic operation uses a single key?",opts:["Hashing","Asymmetric","Padding","Symmetric"],ans:3,rat:"Symmetric cryptography uses a single shared secret key for both encryption and decryption. Asymmetric uses a key pair. Hashing is not a keyed operation by default (though HMAC is). Padding is a data formatting technique to align plaintext to a block size, not a cryptographic operation requiring a key."},
  {q:"Which cryptographic operation has the fastest decryption process?",opts:["Padding","Symmetric","Hashing","Asymmetric"],ans:1,rat:"Symmetric cryptography (e.g., AES, ChaCha20) provides the fastest encryption and decryption, especially with hardware acceleration (AES-NI). Asymmetric operations involve expensive modular exponentiation or elliptic-curve scalar multiplication, making them much slower. Hashing is one-way with no decryption. Padding is a formatting step, not a decryption mechanism."},
  {q:"Which mechanism can be applied to protect the integrity of plaintext when using AES?",opts:["RC4","Message Authentication Code (MAC)","RSA","Kerberos key sharing"],ans:1,rat:"AES alone provides confidentiality but not guaranteed integrity. A MAC (often HMAC-SHA-256 or CMAC-AES) can be applied using the Encrypt-then-MAC pattern. Alternatively, AES-GCM (AEAD) produces an authentication tag internally. RC4 is an unrelated stream cipher. RSA is asymmetric. Kerberos is an authentication protocol, not a message integrity primitive."},
  {q:"Which encryption process sends a list of cipher suites that are supported for encrypted communications?",opts:["Forward secrecy","ServerHello","ClientHello","Integrity check"],ans:2,rat:"In the TLS handshake, the ClientHello message includes the client's supported cipher suite list, advertising combinations of key exchange, authentication, encryption, and integrity algorithms. The server responds with ServerHello, selecting one cipher suite. Forward secrecy is a property achieved by ephemeral key exchange, not a specific message."},
  {q:"A security analyst is using 3DES for data encryption. Which 3DES key size is valid?",opts:["128-bit","2,048-bit","56-bit","112-bit"],ans:3,rat:"Two-key 3DES uses two independent 56-bit DES keys in an EDE sequence, yielding 112 bits of keying material. Three-key 3DES uses 168 bits, but that is not listed here. 56-bit corresponds to single DES. 128-bit is for AES. 2,048-bit is typical for RSA keys, not symmetric ciphers."},
  {q:"What is a component of a one-time password (OTP) that is needed to guess future iterations of passwords?",opts:["Function","Initialization vector","Encryption algorithm","Seed"],ans:3,rat:"OTP systems (HOTP/TOTP) generate passwords using a shared secret seed combined with a moving factor (counter or time). If an attacker obtains the seed and knows the algorithm and moving factor, they can compute future OTPs. The function and algorithm are typically public. An IV is not a standard OTP component."},
  {q:"Which number generator has different results given the same input data?",opts:["Prime","Sequence","Pseudorandom","True random"],ans:3,rat:"A true random number generator (TRNG) produces outputs from nondeterministic physical processes (thermal noise, oscillator jitter), so repeated conditions do not yield the same sequence. A PRNG is deterministic: the same seed produces the same output. TRNGs are often used to seed cryptographically secure PRNGs."},
  {q:"What describes a true random number generator?",opts:["Fast and deterministic, and the same input produces the same results","Slow and nondeterministic, and the same input produces different results","Unique integer determined through factorization of integers","Integer increased by one to match requests and responses"],ans:1,rat:"A TRNG draws randomness from physical phenomena and is nondeterministic — you cannot feed it the same input and expect the same output. TRNGs are often slower than PRNGs because they depend on collecting entropy from hardware sources. Option A describes a deterministic PRNG. Option C describes a factorization problem. Option D describes a counter."},
  {q:"How are limits managed for the number of bitcoins that can be created and stored in a blockchain?",opts:["Rewards for mining reduce over time","The total number of participants has been set","A maximum has been established per country","Each person has a maximum number"],ans:0,rat:"Bitcoin's supply is controlled by the halving schedule: the block subsidy awarded to miners halves every 210,000 blocks, steadily reducing coin creation and asymptotically approaching the 21 million BTC cap. No per-country cap or per-person maximum is enforced by the protocol."},
  {q:"How often are transactions added to a blockchain?",opts:["Approximately every 10 minutes","Approximately every 30 minutes","Approximately every 1 hour","Approximately every 24 hours"],ans:0,rat:"For Bitcoin, the network targets an average block interval of about 10 minutes. A new block containing a batch of transactions is appended at that cadence. A difficulty adjustment mechanism recalibrates mining difficulty roughly every 2016 blocks to keep the interval stable despite changes in network hash power."},
  {q:"What are the primary characteristics of Bitcoin proof of work?",opts:["Difficult to produce and difficult to verify","Difficult to produce and easy to verify","Easy to produce and easy to verify","Easy to produce and difficult to verify"],ans:1,rat:"Bitcoin's proof of work is designed so that finding a valid block (hashing with different nonces until a hash meets the target) is computationally expensive, but verification is trivial — any node can hash the block header once to confirm validity. This asymmetry makes it expensive to rewrite history while keeping validation accessible."},
  {q:"What is modular arithmetic in cryptography?",opts:["The process of encoding messages using large integers","A method of encrypting messages using modular operations","The study of secret codes","The art of deciphering messages using prime numbers"],ans:1,rat:"Modular arithmetic is the mathematics of working with remainders after division by a modulus. In cryptography, RSA relies on modular exponentiation, while Diffie-Hellman and elliptic-curve schemes operate in groups defined by modular arithmetic. It enables stable, repeatable operations with bounded results in finite sets."},
  {q:"What is lattice-based cryptography?",opts:["A technique for encoding messages using lattice points","A blockchain option from clone","A cryptographic scheme based on geometric lattices","A type of encryption algorithm using modular arithmetic"],ans:2,rat:"Lattice-based cryptography uses constructions whose security is based on the hardness of problems on mathematical lattices (high-dimensional grids), such as Learning With Errors (LWE). These problems are believed to remain hard even for quantum computers, making lattice-based schemes major candidates for post-quantum cryptography."},
  {q:"Why are large prime numbers important in cryptography?",opts:["They make encryption faster.","They make decryption easier.","They are used for encoding messages.","They provide security in encryption algorithms."],ans:3,rat:"Large prime numbers enable cryptosystems where certain operations are easy to perform but reversing them is computationally hard without secret information. In RSA, security is based on the difficulty of factoring a large composite of two primes. In Diffie-Hellman, primes define groups where the discrete logarithm problem is hard."},
  {q:"How does a Caesar cipher operate in the encryption of messages?",opts:["Encrypting messages using complex mathematical algorithms","Substitution of letters with their numerical equivalents","Reversing the order of letters in a message","Shifting each letter in the alphabet by a fixed number"],ans:3,rat:"A Caesar cipher replaces each plaintext letter with a letter a fixed number of positions away in the alphabet. With a shift of 3, A becomes D, B becomes E, and so on. The entire key is the single shift value. It is easily broken by brute force (only 25 meaningful shifts) and frequency analysis."},
  {q:"What is the Enigma machine known for in the history of cryptography?",opts:["A type of cryptographic algorithm","A device used for secure communication during World War II","A method for decrypting messages","A software program for encrypting emails"],ans:1,rat:"The Enigma machine was an electro-mechanical cipher device used by Nazi Germany to secure military communications during WWII. It implemented polyalphabetic substitution through rotors, a reflector, and a plugboard. Allied codebreakers at Bletchley Park successfully decrypted Enigma traffic, demonstrating how both mathematics and operational practices determine security."},
  {q:"What is a digital signature?",opts:["A method of encrypting messages","A cryptographic technique to verify the authenticity and integrity of a message","A type of encryption algorithm","A unique identifier for digital files"],ans:1,rat:"A digital signature enables a recipient to verify who created a message (authenticity) and that it has not been altered (integrity). The signer uses a private key to sign a hash of the message. Anyone with the signer's public key can verify the signature. Digital signatures do not provide confidentiality and are not themselves encryption."},
  {q:"What does nonrepudiation aim to achieve in the context of cryptography?",opts:["Verifying the identity of the sender in secure communication","Holding parties accountable for their actions and transactions","Ensuring the confidentiality of encrypted messages","Preventing unauthorized access to sensitive data"],ans:1,rat:"Nonrepudiation prevents a party from later denying an action (sending a message, signing a document). It is supported by digital signatures, audit logs, and trusted timestamping. While related to authentication, the defining goal is accountability — ensuring actions can be attributed to entities in a way that is difficult to dispute."},
  {q:"Which type of encryption is Advanced Encryption Standard (AES) considered to be?",opts:["Hybrid encryption","Quantum encryption","Asymmetric encryption","Symmetric encryption"],ans:3,rat:"AES is a symmetric-key block cipher — the same shared secret key is used for both encryption and decryption. It operates on 128-bit blocks with key sizes of 128, 192, or 256 bits. 'Hybrid encryption' refers to combining asymmetric and symmetric cryptography. AES is not asymmetric and has no quantum-specific properties."},
  {q:"Which is an example of asymmetric encryption?",opts:["Secure Hash Algorithm 256 (SHA-256)","Hash-based Message Authentication Code (HMAC)","Data Encryption Standard (DES)","Elliptic-Curve Cryptography (ECC)"],ans:3,rat:"ECC is a family of asymmetric algorithms built on the mathematics of elliptic curves over finite fields, supporting key exchange (ECDH) and digital signatures (ECDSA/EdDSA). SHA-256 is a hash function. HMAC is a keyed integrity construction. DES is a symmetric block cipher using the same key for encryption and decryption."},
  {q:"What is a characteristic of a hash function?",opts:["Data encryption","Public-private key pair use","One-way","Reversible"],ans:2,rat:"A cryptographic hash function maps input data of arbitrary length to a fixed-length digest and is designed to be one-way: given a digest, it is computationally infeasible to recover the original input (preimage resistance). Hash functions are not encryption, do not use key pairs, and are intentionally irreversible."},
  {q:"Which feature is characteristic of asymmetric encryption?",opts:["Uses both a public and private key","Uses one key for encryption and decryption","Requires multiple encryption rounds","Is irreversible"],ans:0,rat:"Asymmetric encryption is defined by using a key pair: a public key shared widely and a private key kept secret. Data encrypted with one key can be decrypted with the other. Option B describes symmetric cryptography. 'Irreversible' describes hashing, not encryption — the intended holder of the private key can reverse asymmetric encryption."},
  {q:"Which regulation requires organizations to implement strong encryption measures to protect credit card data?",opts:["California Consumer Privacy Act (CCPA)","Payment Card Industry Data Security Standard (PCI DSS)","Health Insurance Portability and Accountability Act (HIPAA)","General Data Protection Regulation (GDPR)"],ans:1,rat:"PCI DSS is the industry standard for organizations that store, process, or transmit cardholder data, including explicit encryption requirements. CCPA and GDPR are privacy regulations for personal data rights. HIPAA applies to protected health information, not payment card data."},
  {q:"Quantum computing poses a threat to which cryptographic algorithm?",opts:["Secure Hash Algorithm 256 (SHA-256)","Advanced Encryption Standard (AES)","Electronic Codebook (ECB)","Rivest–Shamir–Adleman (RSA)"],ans:3,rat:"Shor's algorithm can factor large integers and compute discrete logarithms in polynomial time, directly breaking RSA's factoring assumption. Symmetric algorithms like AES are only affected by Grover's quadratic speedup (mitigated by using larger keys). ECB is a mode of operation with classical issues, not a quantum target. SHA-256 has some quantum exposure but is less directly threatened."},
  {q:"Which encryption mode is known for supporting parallel processing?",opts:["Cipher Feedback (CFB)","Cipher Block Chaining (CBC)","Output Feedback (OFB)","Electronic Codebook (ECB)"],ans:3,rat:"ECB encrypts each block independently with the same key, so multiple blocks can be encrypted or decrypted simultaneously with no chaining dependency. CBC encryption requires the previous ciphertext block and cannot be parallelized. CFB and OFB generate keystream material sequentially. Note: ECB is widely discouraged for most data due to pattern leakage."},
  {q:"What is an example of a block cipher mode of operation?",opts:["Secure Hash Algorithm 256 (SHA-256)","Digital Signature Algorithm (DSA)","Rivest–Shamir–Adleman (RSA)","Electronic Codebook (ECB)"],ans:3,rat:"A block cipher mode of operation defines how a block cipher is applied to data longer than a single block. ECB is a canonical mode that encrypts each plaintext block independently. SHA-256 is a hash function. DSA is a digital signature algorithm. RSA is an asymmetric cryptosystem — none of these are block cipher modes."},
  {q:"What is a characteristic of Cipher Block Chaining (CBC) mode in cryptography?",opts:["It encrypts each block of plaintext dependent on the previous block.","It generates a continuous stream of key material.","It requires a different key for each encryption operation.","It operates on 32-bit blocks."],ans:0,rat:"CBC XORs each plaintext block with the previous ciphertext block before encrypting, making each block dependent on all previous blocks. An IV serves as the 'previous ciphertext' for the first block. CBC does not generate a keystream, does not require a new key per operation, and block size is determined by the underlying cipher."},
  {q:"What is the relationship between Secure Sockets Layer (SSL) and Transport Layer Security (TLS)?",opts:["SSL is the replacement of TLS.","SSL and TLS are identical in function and security.","SSL is only used in email encryption.","TLS replaced SSL to provide improved security."],ans:3,rat:"TLS is the modern successor to SSL. TLS 1.0 was based on SSL 3.0 but with important security fixes, and later versions (TLS 1.2, 1.3) significantly strengthened security by removing weak ciphers and tightening handshake protections. True SSL is deprecated. SSL is not limited to email — it was widely used for web traffic."},
  {q:"Why did NIST choose Ascon for lightweight cryptography?",opts:["To authenticate users during data transmission","To ensure compatibility with legacy systems","To provide a secure and efficient encryption solution for resource-constrained devices","To encrypt data at rest"],ans:2,rat:"NIST selected Ascon because it is an AEAD family designed to be efficient in both hardware and software with a small footprint, making it well-suited for constrained IoT and embedded devices. The selection was about secure, efficient authenticated encryption under tight resource budgets — not legacy compatibility or user authentication."},
  {q:"What is the purpose of code-signing in current systems?",opts:["To generate random numbers for encryption","To verify the integrity and authenticity of software","To compress data for efficient storage","To authenticate users during data transmission"],ans:1,rat:"Code-signing verifies that software comes from a known publisher and has not been modified since it was signed. The publisher signs the application's hash with their private key. OS and browsers verify the signature using the corresponding public key via a certificate chain. This defends against tampering, malware injection, and supply-chain attacks."},
  {q:"How is Public Key Infrastructure (PKI) commonly utilized in web browsers?",opts:["To compress encrypted messages for storage","To authenticate users during data transmission","To securely manage digital certificates and keys","To encrypt data at rest"],ans:2,rat:"Web browsers rely on PKI to establish trust in HTTPS connections through X.509 certificates and a built-in set of trusted root CAs. The browser validates the certificate chain, checks domain binding, confirms validity dates, and may check revocation. PKI manages and validates digital certificates and keys to establish trust for secure communication."},
  {q:"What is the primary purpose of HIPAA in relation to encryption?",opts:["To standardize the use of encryption across all industries","To prohibit the use of electronic health records","To allow healthcare providers to encrypt patient records at their discretion","To ensure the confidentiality of patient information through secure measures like encryption"],ans:3,rat:"HIPAA's Security Rule requires covered entities and business associates to implement appropriate safeguards to protect electronic PHI. Encryption is a key technical safeguard for confidentiality — protecting PHI in transit and at rest. HIPAA does not standardize encryption across all industries and does not prohibit electronic health records."},
  {q:"How can auditing enhance an organization's cryptographic practices?",opts:["It identifies weaknesses in current practices.","It guarantees that no security incidents will occur.","It eliminates the need for regular policy updates.","It ensures all employees are trained in cryptography."],ans:0,rat:"Auditing improves cryptographic practice by systematically evaluating whether controls are correctly selected, implemented, and maintained. Audits can discover weak algorithms, improper key lengths, unsafe modes, poor certificate validation, or key management gaps. Auditing does not guarantee zero incidents, eliminate policy update needs, or automatically ensure training."},
  {q:"How does a cryptographic policy contribute to incident response?",opts:["By providing guidelines for secure data recovery and communication","By limiting the use of encryption tools during incidents","By slowing down the incident resolution process","By increasing the likelihood of data breaches"],ans:0,rat:"A cryptographic policy specifies how to rotate or revoke compromised keys, reissue certificates, preserve evidence integrity with hashing, and use approved encrypted channels during incidents. It defines roles, responsibilities, logging requirements, and escalation steps — reducing confusion and preventing ad hoc crypto changes during incident response."},
  {q:"Which lesson can be learned from organizations that experience breaches due to poor cryptographic practices?",opts:["Comprehensive risk assessments are vital for identifying potential vulnerabilities.","Employee training is not relevant for preventing breaches.","Regular audits and updates are unnecessary.","Security measures should be secondary to business objectives."],ans:0,rat:"Breaches from poor cryptographic practices often stem from preventable issues: outdated algorithms, weak key management, missing integrity checks, or hard-coded secrets. Comprehensive risk assessments proactively identify and prioritize these risks before attackers exploit them. Training and audits are both essential; security cannot be secondary to business objectives."},
  {q:"Why is it important for cryptography frameworks to adapt over time?",opts:["To respond to emerging security threats and vulnerabilities","To maintain a rigid structure for data protection","To standardize the use of obsolete encryption techniques","To comply with outdated technology standards"],ans:0,rat:"Cryptography must evolve because threats, computing capabilities, and attack techniques continuously change. Algorithms once considered safe can become vulnerable due to cryptanalysis or increased computing power (e.g., SHA-1 deprecation, RC4 retirement). Frameworks also need to address new environments and adversary models, including quantum computing threats to current public-key systems."},
  {q:"Which of the following is an example of a software encryption solution for disk storage?",opts:["Virtual Private Network (VPN)","Hardware Security Module (HSM)","BitLocker and FileVault","USB encryption hardware"],ans:2,rat:"BitLocker (Windows) and FileVault (macOS) are software-based full-disk encryption solutions integrated into their operating systems, encrypting sectors on disk using user credentials and hardware features like TPM. A VPN encrypts network traffic in transit. An HSM manages cryptographic keys. USB encryption hardware is hardware-based removable media encryption."},
  {q:"Which cryptographic technique is used to ensure data integrity?",opts:["Authentication","Non-repudiation","Digital signatures","Steganography"],ans:2,rat:"Digital signatures ensure data integrity by binding a message hash to the signer's private key. Any change to the message alters the digest and causes verification to fail. Authentication is broader. Non-repudiation is an outcome, not a standalone technique. Steganography hides the existence of data but does not protect integrity."},
  {q:"What is a key benefit of using a cryptography framework?",opts:["It guarantees complete security against all attacks.","It removes the need for employee training in security.","It is solely focused on regulatory compliance.","It provides a structured approach to implementing encryption practices."],ans:3,rat:"A cryptography framework provides a consistent, repeatable approach to selecting, deploying, and managing cryptographic controls — defining approved algorithms, key sizes, modes, and key management rules. It does not guarantee perfect security, eliminate training needs, or focus solely on compliance; it is about sound security engineering and governance."},
  {q:"What is a focus of the ISO/IEC 27001 standard?",opts:["Development of new encryption algorithms","Risk management and continuous improvement of information security","Enforcement of criminal penalties for data breaches","Exclusively addressing network security"],ans:1,rat:"ISO/IEC 27001 is an international standard for establishing, implementing, and continually improving an Information Security Management System (ISMS), using a risk-based methodology. It covers a broad range of security domains beyond cryptography. It does not invent algorithms, enforce criminal penalties, or limit itself to network security."},
  {q:"Why is lightweight cryptography important in modern information security?",opts:["To complicate data protection measures","To ensure secure communication on high-speed networks","To limit the use of encryption tools in organizations","To address the security needs of Internet of Things (IoT) devices and mobile applications"],ans:3,rat:"Lightweight cryptography is important because many modern IoT and embedded systems have limited CPU, memory, storage, bandwidth, and battery power. Traditional cryptographic suites may be too resource-intensive for these platforms. Lightweight primitives deliver strong security (often AEAD) within tight resource budgets, enabling practical security where it might otherwise be absent."},
  {q:"Which is a primary reason for ethical concerns about encryption?",opts:["It only benefits large corporations.","It complicates government access to potentially crucial information.","It provides faster data transmission.","It reduces data storage requirements."],ans:1,rat:"Ethical concerns about encryption arise from the tension between individual privacy/security and law enforcement needs. Strong end-to-end encryption can limit legitimate government access to communications even with warrants, fueling 'going dark' debates and proposals for exceptional access or backdoors. Speed and storage reduction are not the core ethical controversy."},
  {q:"What is the significance of the Nobody But Us (NOBUS) principle in cryptography?",opts:["It refers to a cryptographic key that can be accessed by anyone.","It denotes a cryptographic algorithm with known weaknesses.","It represents a widely used encryption standard.","It indicates that a vulnerability is so difficult to exploit that only the entity that created it can exploit it."],ans:3,rat:"NOBUS suggests that an exploitable weakness can be kept usable only by the party that designed it (e.g., a government) while remaining infeasible for others. Critics argue this assumption is fragile because vulnerabilities can be independently discovered, leaked, or weaponized. Modern security engineering generally favors eliminating known weaknesses rather than relying on assumed capability asymmetry."},
  {q:"Which of the following best describes lightweight cryptography?",opts:["Cryptography that focuses solely on increasing encryption strength","Cryptographic methods that are only applicable in military settings","A method of encryption that is outdated and rarely used","Cryptographic algorithms designed for resource-constrained environments"],ans:3,rat:"Lightweight cryptography refers to cryptographic primitives and profiles engineered for constrained environments with limited CPU, memory, power, bandwidth, and code size, while still providing robust security. It is not simply stronger encryption, not restricted to military settings, and is decidedly modern — motivated by the rapid growth of IoT and pervasive computing."}
];

const originalQuestions=[...questions];
let activeQuestions=[...questions];
let mode=null,current=0,testState=[],testGraded=false,flagged=[],practiceState=[];

function resetState(){current=0;testGraded=false;flagged=activeQuestions.map(()=>false);testState=activeQuestions.map(()=>null);practiceState=activeQuestions.map(()=>({picked:null,showAnswer:false}));}

function numGrid(){
  const btns=activeQuestions.map((_,i)=>{
    let cls='num-btn';
    if(i===current)cls+=' active';
    if(flagged[i])cls+=' flagged';
    if(mode==='test'){
      if(testGraded){if(testState[i]===activeQuestions[i].ans)cls+=' done-correct';else if(testState[i]!==null)cls+=' done-wrong';else cls+=' done-revealed';}
      else if(testState[i]!==null)cls+=' num-selected';
    } else {
      const ps=practiceState[i];
      if(ps.showAnswer)cls+=' done-revealed';
      else if(ps.picked!==null)cls+=' done-picked';
    }
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
  const flagCount=flagged.filter(Boolean).length;
  return `<div class="num-grid">${btns}</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--flag-bg);border-color:var(--flag-border);"></div><span>&#127988; Flagged for review${flagCount>0?' ('+flagCount+')':''}</span></div>
      ${mode==='test'&&!testGraded?'<div class="legend-item"><div class="legend-dot" style="background:var(--selected-bg);border-color:var(--selected-border);"></div><span>Answered</span></div>':''}
    </div>`;
}
function jumpTo(i){current=i;render();}

function renderHistory(){
  const root=document.getElementById('root');
  const history=JSON.parse(localStorage.getItem('cryptoQuizHistory')||'[]');
  const rows=history.length?history.map((e,i)=>`
    <tr>
      <td>${history.length-i}</td>
      <td>${e.date} ${e.time}</td>
      <td class="${e.pct>=90?'hist-pass':e.pct>=70?'hist-mid':'hist-fail'}">${e.score}/${e.total} &nbsp;(${e.pct}%)</td>
      <td>${e.wrong}</td>
      <td>${e.unanswered}</td>
    </tr>`).join(''):'';
  const emptyMsg=history.length?'':`<div class="history-empty">No results yet &mdash; take a test first!</div>`;
  const tableHtml=history.length?`<table class="history-table">
    <thead><tr><th>#</th><th>Date &amp; Time</th><th>Score</th><th>Wrong</th><th>Skipped</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <button class="clear-hist-btn" onclick="clearHistory()">&#128465; Clear history</button>`:'';
  root.innerHTML=`<div class="history-screen">
    <h2>&#128200; Score History</h2>
    ${emptyMsg}${tableHtml}
    <div style="margin-top:1.25rem;">
      <button class="action-btn" onclick="renderModeSelect()">&#8592; Back to menu</button>
    </div>
  </div>`;
}
function clearHistory(){
  if(confirm('Clear all saved results?')){localStorage.removeItem('cryptoQuizHistory');renderHistory();}
}
function renderModeSelect(){
  document.getElementById('root').innerHTML=`
    <div class="mode-screen">
      <p>${activeQuestions.length} questions &nbsp;&middot;&nbsp; Choose your mode</p>
      <div class="mode-cards">
        <div class="mode-card" onclick="startMode('test')">
          <div class="icon">&#128221;</div><div class="title">Test</div>
          <div class="desc">Select answers freely, flag questions to revisit, then submit for grading.</div>
        </div>
        <div class="mode-card" onclick="startMode('practice')">
          <div class="icon">&#128218;</div><div class="title">Practice</div>
          <div class="desc">Show/hide answers, flag questions to revisit. No score.</div>
        </div>
      </div>
      <div style="margin-top:1.5rem;">
        <button class="action-btn" onclick="renderHistory()" style="font-size:13px;padding:8px 16px;color:var(--text2);">&#128200; View score history</button>
      </div>
    </div>`;
}
function startMode(m){mode=m;if(m==="test"){const copy=[...originalQuestions];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}activeQuestions=copy;}else{activeQuestions=[...originalQuestions];}resetState();render();}

function render(){
  const root=document.getElementById('root');
  if(mode==='test'&&testGraded&&current>=activeQuestions.length){renderTestResults();return;}
  if(mode==='practice'&&current>=activeQuestions.length){renderPracticeEnd();return;}
  const q=activeQuestions[current];
  const pct=Math.round((current/questions.length)*100);
  const isLast=current===activeQuestions.length-1;
  const isFlagged=flagged[current];
  let optHtml='',fbText='',fbCls='feedback',practiceControls='',rationaleHtml='',navRight='',hint='';

  if(mode==='test'){
    const sel=testState[current];
    optHtml=q.opts.map((o,i)=>{
      let cls='opt-btn';
      if(testGraded){if(i===q.ans)cls+=' correct';else if(i===sel)cls+=' wrong';}
      else if(i===sel)cls+=' selected';
      return `<button class="${cls}" ${testGraded?'disabled':''} onclick="testPick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;
    }).join('');
    if(testGraded){
      if(sel===q.ans){fbText='&#10003; Correct!';fbCls+=' correct';}
      else if(sel===null){fbText='Not answered';fbCls+=' info';}
      else{fbText='&#10007; Incorrect &mdash; correct: '+String.fromCharCode(65+q.ans)+') '+q.opts[q.ans];fbCls+=' wrong';}
      rationaleHtml=`<div class="rationale"><strong>Rationale:</strong> ${q.rat}</div>`;
    } else {hint=`<div class="hint">Select an answer &mdash; you can change it before submitting</div>`;}
    if(isLast&&!testGraded){navRight=`<button class="action-btn" ${current===0?'disabled':''} onclick="prev()">&larr; Back</button><button class="submit-btn" onclick="submitTest()">Submit all &rarr;</button>`;}
    else{navRight=`<button class="action-btn" ${current===0?'disabled':''} onclick="prev()">&larr; Back</button><button class="next-btn" onclick="next()">${isLast&&testGraded?'Results &rarr;':'Next &rarr;'}</button>`;}
  } else {
    const ps=practiceState[current];
    optHtml=q.opts.map((o,i)=>{
      let cls='opt-btn';
      if(ps.showAnswer&&i===q.ans)cls+=' revealed';
      if(ps.picked===i&&!(ps.showAnswer&&i===q.ans))cls+=' picked';
      return `<button class="${cls}" onclick="practicePick(${i})">${String.fromCharCode(65+i)}) ${o}</button>`;
    }).join('');
    if(ps.showAnswer){
      fbText='Answer: '+String.fromCharCode(65+q.ans)+') '+q.opts[q.ans];fbCls+=' info';
      rationaleHtml=`<div class="rationale"><strong>Rationale:</strong> ${q.rat}</div>`;
      practiceControls=`<button class="action-btn active-toggle" onclick="toggleShowAnswer()">Hide answer</button>`;
    } else if(ps.picked!==null){
      fbText='Selected: '+String.fromCharCode(65+ps.picked)+') '+q.opts[ps.picked];fbCls+=' info';
      practiceControls=`<button class="action-btn" onclick="toggleShowAnswer()">Show answer</button>`;
    } else {
      practiceControls=`<button class="action-btn" onclick="toggleShowAnswer()">Show answer</button>`;
    }
    navRight=`<button class="action-btn" ${current===0?'disabled':''} onclick="prev()">&larr; Back</button><button class="next-btn" onclick="next()">${isLast?'Finish &rarr;':'Next &rarr;'}</button>`;
  }

  const badge=mode==='practice'?'<span class="mode-badge badge-practice">Practice</span>':'<span class="mode-badge badge-test">Test</span>';
  root.innerHTML=`
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    ${badge}
    <div class="q-counter">Question ${current+1} of ${questions.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${optHtml}</div>
    ${hint}
    <div class="feedback-wrap"><div class="${fbCls}">${fbText}</div></div>
    ${rationaleHtml}
    <div class="nav">
      <div class="nav-left">
        <button class="action-btn" onclick="backToMenu()">&#8862; Menu</button>
        <button class="${isFlagged?'flag-btn flagged':'flag-btn'}" onclick="toggleFlag()">&#127988; ${isFlagged?'Flagged':'Flag'}</button>
        ${practiceControls}
      </div>
      <div class="nav-right">${navRight}</div>
    </div>
    ${numGrid()}`;
}

function testPick(i){if(testGraded)return;testState[current]=i;render();}

function saveResult(score, total, wrong, unanswered){
  const pct=Math.round((score/total)*100);
  const now=new Date();
  const entry={date:now.toLocaleDateString(),time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),score,total,wrong,unanswered,pct};
  const history=JSON.parse(localStorage.getItem('cryptoQuizHistory')||'[]');
  history.unshift(entry);
  if(history.length>20) history.pop();
  localStorage.setItem('cryptoQuizHistory', JSON.stringify(history));
}
function submitTest(){testGraded=true;current=0;flagged=activeQuestions.map(()=>false);render();}
function practicePick(i){practiceState[current].picked=i;render();}
function toggleShowAnswer(){practiceState[current].showAnswer=!practiceState[current].showAnswer;render();}
function toggleFlag(){flagged[current]=!flagged[current];render();}
function next(){current++;render();}
function prev(){if(current>0){current--;render();}}
function backToMenu(){mode=null;renderModeSelect();}

function renderTestResults(){
  const root=document.getElementById('root');
  const score=testState.filter((s,i)=>s===activeQuestions[i].ans).length;
  const wrong=testState.filter((s,i)=>s!==null&&s!==activeQuestions[i].ans).length;
  const unanswered=testState.filter(s=>s===null).length;
  const stillFlagged=flagged.filter(Boolean).length;
  const pct=Math.round((score/activeQuestions.length)*100);
  saveResult(score,activeQuestions.length,wrong,unanswered);
  const msg=pct>=90?'&#127881; Excellent work!':pct>=70?'&#128077; Good job &mdash; keep reviewing!':'&#128218; Keep studying &mdash; you\'ve got this!';
  const missedItems=activeQuestions.map((q,i)=>testState[i]!==q.ans?{q:q.q,correct:String.fromCharCode(65+q.ans)+') '+q.opts[q.ans]}:null).filter(Boolean);
  const missedHtml=missedItems.length?'<div class="missed-list">'+missedItems.map(m=>`<div class="missed-item"><div class="missed-q">${m.q}</div><div class="missed-a">&#10003; ${m.correct}</div></div>`).join('')+'</div>':'';
  root.innerHTML=`<div class="score-card"><div class="score-num">${score}/${questions.length}</div><div class="score-label">${pct}% correct</div>
    <div class="summary-row">
      <span class="summary-pill pill-correct">&#10003; ${score} correct</span>
      <span class="summary-pill pill-wrong">&#10007; ${wrong} wrong</span>
      ${unanswered?`<span class="summary-pill" style="background:var(--hover);color:var(--text2)">&#8212; ${unanswered} skipped</span>`:''}
      ${stillFlagged?`<span class="summary-pill pill-flag">&#127988; ${stillFlagged} flagged</span>`:''}
    </div>
    <div class="score-msg">${msg}</div>
    <div class="end-btns">
      <button class="restart-btn" onclick="reviewTest()">Review answers</button>
      <button class="restart-btn" onclick="startMode('test')">Retake test</button>
      <button class="restart-btn" onclick="startMode('practice')">Practice mode</button>
      <button class="restart-btn" onclick="backToMenu()">Menu</button>
    </div>
    ${missedItems.length?'<p style="font-size:13px;color:var(--text2);margin-top:1.5rem;text-align:left;font-weight:500;">Questions you missed:</p>'+missedHtml:''}</div>`;
}
function reviewTest(){current=0;render();}
function renderPracticeEnd(){
  document.getElementById('root').innerHTML=`<div class="practice-end"><div class="big">&#128218;</div><h2>Practice complete!</h2><p>You reviewed all ${activeQuestions.length} questions.</p><div class="end-btns"><button class="restart-btn" onclick="startMode('practice')">Practice again</button><button class="restart-btn" onclick="startMode('test')">Take the test</button><button class="restart-btn" onclick="backToMenu()">Menu</button></div></div>`;
}

renderModeSelect();
</script>
